services:
  web:
    build:
      target: test
    command: ["pnpm", "--filter", "@avelys/web", "dev"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-http://localhost:7000/realms/avelys}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-avelys-web}
    ports: !override
      - "5173:5173"
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
      - ./apps/web/public:/workspace/apps/web/public
      - ./apps/web/index.html:/workspace/apps/web/index.html
      - ./apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts
