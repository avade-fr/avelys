services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The production ingress owns /api routing. Compose exposes the API directly.
        VITE_API_BASE_URL: http://localhost:8000/api/v1
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-http://localhost:7000/realms/avelys}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-avelys-web}
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:7000/realms/avelys}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:7000/realms/avelys/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-avelys-api}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - default
      - keycloak

  web-test:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: test

  api-test:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: test

networks:
  keycloak:
    external: true
