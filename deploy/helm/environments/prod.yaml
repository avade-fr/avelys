imagePullSecrets:
  - name: registry

registryCredentials:
  enabled: true
  name: avelys-prod-registry
  annotations:
    argocd.argoproj.io/tracking-id: >-
      avelys-prod:secrets.hashicorp.com/VaultStaticSecret:avelys-prod/avelys-prod-registry
    argocd.argoproj.io/sync-wave: "-1"
  mount: secret
  path: avelys-prod/registry

oidc:
  issuerUrl: https://auth.avade.fr/realms/avelys

web:
  image:
    repository: dtr.admin.avade.fr/avelys/web
    # Commit tags are suitable for previews; formal releases use an exact Git tag.
    tag: v1.0.3
  runtimeConfig:
    apiBaseUrl: https://api.avelys.io/v1

api:
  enabled: false
  image:
    repository: dtr.admin.avade.fr/avelys/api
    tag: "0.1.0"
  config:
    appEnv: production
    corsOrigins: https://avelys.io
    authEnabled: true

ingress:
  host: avelys.io
  annotations:
    # TLS terminates at the external Nginx, which already enforces HTTPS.
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  tls:
    secretName: avelys-io-tls

autoscaling:
  api:
    enabled: false
