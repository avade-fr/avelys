imagePullSecrets:
  - name: registry

registryCredentials:
  enabled: true
  name: avelys-dev-registry
  annotations:
    argocd.argoproj.io/tracking-id: >-
      avelys-dev:secrets.hashicorp.com/VaultStaticSecret:avelys-dev/avelys-dev-registry
    argocd.argoproj.io/sync-wave: "-1"
  mount: secret
  path: avelys-dev/registry

web:
  replicaCount: 1
  image:
    repository: dtr.admin.avade.fr/avelys/web
    tag: COMMIT_bf127ec5
  runtimeConfig:
    oidcAuthority: ""

api:
  enabled: false

ingress:
  host: dev.avelys.io
  annotations:
    # TLS terminates at the external Nginx, which already enforces HTTPS.
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  tls:
    secretName: avelys-dev-tls

podDisruptionBudget:
  enabled: false
