web:
  replicaCount: 1
  image:
    repository: dtr.admin.avade.fr/avelys/web
    tag: dev
  runtimeConfig:
    oidcAuthority: https://sso.dev.example.com/realms/avelys
    oidcClientId: avelys-web
    oidcRedirectUri: https://avelys.dev.example.com/auth/callback
    oidcPostLogoutRedirectUri: https://avelys.dev.example.com/

api:
  enabled: true
  replicaCount: 1
  image:
    repository: dtr.admin.avade.fr/avelys/api
    tag: dev
  config:
    appEnv: development
    corsOrigins: https://avelys.dev.example.com
    authEnabled: true
    oidcIssuerUrl: https://sso.dev.example.com/realms/avelys
    oidcAudience: avelys-api

ingress:
  host: avelys.dev.example.com
  tls:
    secretName: avelys-dev-tls

podDisruptionBudget:
  enabled: false
