imagePullSecrets:
  - name: registry

registryCredentials:
  enabled: true
  name: avelys-dev-registry
  annotations:
    argocd.argoproj.io/tracking-id: >-
      avelys-dev:secrets.hashicorp.com/VaultStaticSecret:avelys-dev/avelys-dev-registry
    argocd.argoproj.io/sync-wave: "-1"
  mount: secret
  path: avelys-dev/registry

oidc:
  issuerUrl: https://auth.avade.fr/realms/avelys-dev

web:
  replicaCount: 1
  image:
    repository: dtr.admin.avade.fr/avelys/web
    tag: v1.1.0
  runtimeConfig:
    apiBaseUrl: https://dev-api.avelys.io/v1

api:
  enabled: true
  ingressHost: dev-api.avelys.io
  replicaCount: 1
  image:
    repository: dtr.admin.avade.fr/avelys/api
    tag: v1.1.0
  config:
    appEnv: development
    corsOrigins: https://dev.avelys.io

ingress:
  host: dev.avelys.io
  annotations:
    # TLS terminates at the external Nginx, which already enforces HTTPS.
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  tls:
    secretName: avelys-dev-tls

podDisruptionBudget:
  enabled: false
