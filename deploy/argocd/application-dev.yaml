apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: avelys-dev
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: git@github.com:avade-fr/avelys.git
    targetRevision: master
    path: deploy/helm/avelys
    helm:
      releaseName: avelys
      valueFiles:
        - ../environments/dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: avelys-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
