[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avelys-api"
version = "0.1.0"
description = "Backend API for the Avelys customer platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.1,<1.0",
  "pydantic-settings>=2.10.1,<3.0",
  "pyjwt[crypto]>=2.10.1,<3.0",
  "uvicorn[standard]>=0.35.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0",
  "pytest>=8.4.1,<9.0",
  "pytest-cov>=6.2.1,<7.0",
  "ruff>=0.12.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

